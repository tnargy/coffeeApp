# Build the app and deploy it to GitHub Pages on every push to master.
# The site keeps its custom domain (coffee.gandyland.dev) via public/CNAME,
# so the origin — and the IndexedDB data in the operator's browser — does not change.
# The app uses BrowserRouter, so dist/404.html is a copy of dist/index.html:
# GitHub Pages serves it for any path, letting client-side routing handle it.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
